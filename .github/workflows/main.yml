name: Threads Bot

on:
  schedule:
    - cron: "13,43 * * * *"

  workflow_dispatch:

jobs:
  post:
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false

      - run: node bot.js
        env:
          THREADS_TOKEN: ${{ secrets.THREADS_TOKEN }}
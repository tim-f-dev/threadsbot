name: Threads Bot

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:

jobs:
  post:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false

      - run: node bot.js
        env:
          THREADS_TOKEN: ${{ secrets.THREADS_TOKEN }}
